<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamus Zasha.online — ROOT SYSTEM</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hk-body { overflow-y:auto; padding:14px 16px; font-size:13.5px; line-height:1.55; text-shadow:0 0 5px rgba(0,255,0,.5); }
    .hk-body::-webkit-scrollbar { width:4px; }
    #terminal, #editor { max-width:860px; margin:0 auto; }
  </style>
</head>
<body>

<div class="hk-page">
  <div class="hk-stage">
    <canvas class="hk-rain" id="hkRain"></canvas>
    <div class="hk-win">

      <div class="hk-bar">
        <span class="hk-dot" style="background:#ff5f56;box-shadow:0 0 4px #ff5f5680"></span>
        <span class="hk-dot" style="background:#ffbd2e;box-shadow:0 0 4px #ffbd2e80"></span>
        <span class="hk-dot" style="background:#27c93f;box-shadow:0 0 4px #27c93f80"></span>
        <span class="bar-label">root@zasha.online: ~/kamus</span>
        <span class="bar-right">&#x1F512; SECURED</span>
      </div>

      <div class="hk-body">
        <div id="terminal">
          <div id="history"></div>
          <div class="input-line">
            <span class="prompt" id="prompt-text"></span>
            <input type="password" id="cmdInput" autocomplete="off" autofocus spellcheck="false">
          </div>
        </div>

        <div id="editor">
          <div class="editor-header">Script Editor --- Dir: [<span id="edit-dir"></span>] --- Script: <span id="edit-keyword"></span></div>
          <div class="system-msg">COMMAND: Tekan <b>CTRL + S</b> untuk Save/Compile. Tekan <b>ESC</b> untuk Abort.</div>
          <textarea id="editor-textarea" spellcheck="false"></textarea>
        </div>

        <div id="hacker-footer">
          <div id="footer-status">SYSTEM IDLE...</div>
          <div id="footer-bar">[<span id="footer-progress">----------</span>] <span id="footer-percent">0%</span></div>
        </div>
      </div>

      <div class="hk-foot">
        <span><span class="dot-live"></span><b>ONLINE</b></span>
        <span>CPU <b id="hkCpu">--</b> &middot; MEM <b id="hkMem">--</b> &middot; PING <b id="hkPing">--</b></span>
      </div>

    </div>
    <div class="hk-scan"></div>
  </div>
</div>

<script type="module" src="app.js?v=1"></script>
<script>
(function(){
  var cv=document.getElementById('hkRain'); if(!cv)return;
  var ctx=cv.getContext('2d'),st=cv.parentElement,fs=14;
  var chars='アイウエオカキクケコ0123456789ABCDEF!@#$%'.split('');
  function resize(){cv.width=st.clientWidth;cv.height=st.clientHeight;}
  resize(); window.addEventListener('resize',resize);
  var drops=[];
  function initDrops(){drops=Array.from({length:Math.floor(cv.width/fs)},function(){return Math.floor(Math.random()*-50);});}
  initDrops();
  setInterval(function(){
    ctx.fillStyle='rgba(2,4,2,0.08)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#0f0';ctx.font=fs+'px monospace';
    for(var i=0;i<drops.length;i++){
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*fs,drops[i]*fs);
      if(drops[i]*fs>cv.height&&Math.random()>0.975)drops[i]=0;
      drops[i]++;
    }
  },55);
  function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  var eC=document.getElementById('hkCpu'),eM=document.getElementById('hkMem'),eP=document.getElementById('hkPing');
  function upd(){eC.textContent=(Math.random()*35+4).toFixed(1)+'%';eM.textContent=(Math.random()*25+38).toFixed(1)+'%';eP.textContent=rnd(6,48)+'ms';}
  upd();setInterval(upd,900);
})();
</script>
</body>
</html>
