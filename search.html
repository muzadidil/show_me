<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search :: Zasha.online</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hk-body { overflow-y:auto; padding:16px; }
    #search-header {
      border-bottom:1px solid #003300; padding-bottom:10px; margin-bottom:16px;
      display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
    }
    #search-header h1 { font-size:13px; color:#00aa00; text-shadow:none; font-weight:normal; }
    #search-header nav a { color:#004400; text-decoration:none; font-size:12px; margin-left:12px; }
    #search-header nav a:hover { color:#0f0; }

    #search-form { display:flex; gap:10px; margin-bottom:12px; }
    #search-input {
      flex:1; background:transparent; border:1px solid #004400;
      color:#0f0; font-family:'Courier New',monospace; font-size:15px;
      padding:8px 12px; outline:none;
      text-shadow:0 0 5px rgba(0,255,0,.5); transition:border-color .15s;
    }
    #search-input:focus { border-color:#0f0; }
    #search-input::placeholder { color:#003300; text-shadow:none; }
    #search-btn {
      background:transparent; border:1px solid #0f0; color:#0f0;
      font-family:'Courier New',monospace; font-size:13px;
      padding:8px 18px; cursor:pointer; white-space:nowrap;
    }
    #search-btn:hover   { background:rgba(0,255,0,.08); }
    #search-btn:active  { background:rgba(0,255,0,.15); }
    #search-btn:disabled { opacity:.4; cursor:not-allowed; }

    #status { font-size:12px; margin-bottom:12px; min-height:18px; text-shadow:none; }
    .s-loading { color:#ffaa00; }
    .s-count   { color:#00aa00; }
    .s-empty   { color:#005500; }
    .s-error   { color:#ff3333; text-shadow:0 0 5px #ff3333; }

    #table-wrap { overflow-x:auto; border:1px solid #002200; }
    #table-wrap:empty { border:none; }
    #search-table { width:100%; border-collapse:collapse; font-size:12px; }
    #search-table thead th {
      background:#001a00; color:#0f0; padding:7px 12px;
      text-align:left; border-bottom:1px solid #0f0;
      white-space:nowrap; position:sticky; top:0; text-shadow:none; font-weight:bold;
    }
    #search-table tbody td {
      padding:6px 12px; border-bottom:1px solid #001200; color:#00cc00;
      text-shadow:none; white-space:nowrap; max-width:280px;
      overflow:hidden; text-overflow:ellipsis;
    }
    #search-table tbody tr:hover td { background:rgba(0,255,0,.04); }
    #search-table tbody tr:nth-child(even) td { background:rgba(0,255,0,.015); }
  </style>
</head>
<body>

<div class="hk-page">
  <div class="hk-stage">
    <canvas class="hk-rain" id="hkRain"></canvas>
    <div class="hk-win">

      <div class="hk-bar">
        <span class="hk-dot" style="background:#ff5f56;box-shadow:0 0 4px #ff5f5680"></span>
        <span class="hk-dot" style="background:#ffbd2e;box-shadow:0 0 4px #ffbd2e80"></span>
        <span class="hk-dot" style="background:#27c93f;box-shadow:0 0 4px #27c93f80"></span>
        <span class="bar-label">root@zasha.online: ~/search</span>
        <span class="bar-right">&#x1F512; ENCRYPTED</span>
      </div>

      <div class="hk-body">
        <div id="search-header">
          <h1>== SEARCH :: ZASHA.ONLINE ==</h1>
          <nav>
            <a href="index.html">KAMUS</a>
            <a href="todo.html">TODO</a>
            <a href="notes.html">NOTES</a>
            <a href="excel.html">EXCEL</a>
          </nav>
        </div>

        <div id="search-form">
          <input type="text" id="search-input" placeholder="ketik kata kunci, tekan Enter..."
            autocomplete="off" spellcheck="false" autofocus>
          <button id="search-btn">[SEARCH]</button>
        </div>

        <div id="status"></div>
        <div id="table-wrap"></div>
      </div>

      <div class="hk-foot">
        <span><span class="dot-live"></span><b>ONLINE</b></span>
        <span>CPU <b id="hkCpu">--</b> &middot; MEM <b id="hkMem">--</b> &middot; PING <b id="hkPing">--</b></span>
      </div>

    </div>
    <div class="hk-scan"></div>
  </div>
</div>

<script>
  const API_URL   = 'https://script.google.com/macros/s/AKfycbx_qpzdVOuVyb4fvzLxsCLH-IzM1fJFPaNyqKLrhWPJFNCkp-5XXHoRRXcYNmtQXjK8XQ/exec';
  const API_TOKEN = 'muzadidil';

  const searchInput = document.getElementById('search-input');
  const searchBtn   = document.getElementById('search-btn');
  const statusEl    = document.getElementById('status');
  const tableWrap   = document.getElementById('table-wrap');

  searchBtn.addEventListener('click', handleSearch);
  searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleSearch(); });

  async function handleSearch() {
    const q = searchInput.value.trim();
    if (!q) { setStatus('Masukkan kata kunci terlebih dahulu.', 'empty'); return; }
    await runSearch(q);
  }

  async function runSearch(q) {
    setLoading(true);
    setStatus('> searching "' + q + '"...', 'loading');
    tableWrap.innerHTML = '';
    try {
      const res  = await fetch(API_URL + '?token=' + encodeURIComponent(API_TOKEN) + '&q=' + encodeURIComponent(q));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      if (json.error) { setStatus('[' + json.error.toUpperCase() + '] ' + (json.message || ''), 'error'); return; }
      if (json.count === 0) { setStatus('Tidak ada hasil untuk "' + q + '".', 'empty'); return; }
      setStatus(json.count + ' baris ditemukan untuk "' + q + '".', 'count');
      renderTable(json.data);
    } catch (err) {
      setStatus('[ERROR] Gagal menghubungi API: ' + err.message, 'error');
    } finally {
      setLoading(false);
    }
  }

  function renderTable(rows) {
    if (!rows.length) return;
    const headers = Object.keys(rows[0]);
    const table   = document.createElement('table');
    table.id = 'search-table';
    const thead = table.createTHead(), hrow = thead.insertRow();
    headers.forEach(h => { const th = document.createElement('th'); th.textContent = h; hrow.appendChild(th); });
    const tbody = table.createTBody();
    rows.forEach(row => {
      const tr = tbody.insertRow();
      headers.forEach(h => { const td = tr.insertCell(); td.textContent = (row[h] !== undefined && row[h] !== null) ? String(row[h]) : ''; });
    });
    tableWrap.appendChild(table);
  }

  function setStatus(msg, type) { statusEl.textContent = msg; statusEl.className = 's-' + (type || 'count'); }
  function setLoading(on) { searchBtn.disabled = on; searchInput.disabled = on; searchBtn.textContent = on ? '[...]' : '[SEARCH]'; }
</script>
<script>
(function(){
  var cv=document.getElementById('hkRain'); if(!cv)return;
  var ctx=cv.getContext('2d'),st=cv.parentElement,fs=14;
  var chars='アイウエオカキクケコ0123456789ABCDEF!@#$%'.split('');
  function resize(){cv.width=st.clientWidth;cv.height=st.clientHeight;}
  resize(); window.addEventListener('resize',resize);
  var drops=Array.from({length:Math.floor(cv.width/fs)},function(){return Math.floor(Math.random()*-50);});
  setInterval(function(){
    ctx.fillStyle='rgba(2,4,2,0.08)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#0f0';ctx.font=fs+'px monospace';
    for(var i=0;i<drops.length;i++){
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*fs,drops[i]*fs);
      if(drops[i]*fs>cv.height&&Math.random()>0.975)drops[i]=0;
      drops[i]++;
    }
  },55);
  function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  var eC=document.getElementById('hkCpu'),eM=document.getElementById('hkMem'),eP=document.getElementById('hkPing');
  function upd(){eC.textContent=(Math.random()*35+4).toFixed(1)+'%';eM.textContent=(Math.random()*25+38).toFixed(1)+'%';eP.textContent=rnd(6,48)+'ms';}
  upd();setInterval(upd,900);
})();
</script>
</body>
</html>
