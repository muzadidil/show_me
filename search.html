<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search :: Zasha.online</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin:0; padding:0; overflow:hidden; }
    .hk-body { overflow:hidden; padding:0; }
    #app { flex:1; flex-direction:column; overflow:hidden; display:flex; }

    #layout { display:flex; flex:1; overflow:hidden; }

    #sidebar {
      width:200px; min-width:160px;
      display:flex; flex-direction:column;
      border-right:1px solid #003300; flex-shrink:0;
    }
    #sidebar-top {
      padding:8px 12px; border-bottom:1px solid #003300;
      font-size:12px; color:#00aa00; text-shadow:none; flex-shrink:0;
    }
    #history-list { flex:1; overflow-y:auto; }
    .hist-item {
      padding:8px 12px; border-bottom:1px solid #001a00;
      font-size:12px; color:#004400; cursor:pointer;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:none;
    }
    .hist-item:hover { color:#0f0; background:rgba(0,255,0,.04); }

    #main-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }

    #status { padding:6px 15px; font-size:12px; min-height:28px; text-shadow:none; flex-shrink:0; color:#004400; }
    .s-loading { color:#ffaa00 !important; }
    .s-count   { color:#00aa00 !important; }
    .s-empty   { color:#005500 !important; }
    .s-error   { color:#ff3333 !important; }

    #table-wrap { flex:1; overflow:auto; display:none; border-top:1px solid #001a00; }
    #search-table { width:100%; border-collapse:collapse; font-size:12px; }
    #search-table thead th {
      background:#001a00; color:#0f0; padding:7px 12px;
      text-align:left; border-bottom:1px solid #0f0;
      white-space:nowrap; position:sticky; top:0; text-shadow:none; font-weight:bold;
    }
    #search-table tbody td {
      padding:6px 12px; border-bottom:1px solid #001200; color:#00cc00;
      text-shadow:none; white-space:nowrap; max-width:280px;
      overflow:hidden; text-overflow:ellipsis;
    }
    #search-table tbody tr:hover td { background:rgba(0,255,0,.04); }
    #search-table tbody tr:nth-child(even) td { background:rgba(0,255,0,.015); }

    #empty-state {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      color:#002200; text-shadow:none; font-size:12px; gap:8px; text-align:center;
    }

    @media (max-width:600px) {
      #layout { flex-direction:column; }
      #sidebar { width:100%; border-right:none; border-bottom:1px solid #003300; max-height:150px; }
    }
  </style>
</head>
<body>

<div class="hk-stage hk-fullpage">
  <canvas class="hk-rain" id="hkRain"></canvas>
  <div class="hk-win">

    <div class="hk-bar">
      <span class="hk-dot" style="background:#ff5f56;box-shadow:0 0 4px #ff5f5680"></span>
      <span class="hk-dot" style="background:#ffbd2e;box-shadow:0 0 4px #ffbd2e80"></span>
      <span class="hk-dot" style="background:#27c93f;box-shadow:0 0 4px #27c93f80"></span>
      <span class="bar-label">root@zasha.online: ~/search</span>
      <span class="bar-right">&#x1F512; ENCRYPTED</span>
    </div>

    <div class="hk-body">
      <div id="app">
        <div id="app-header">
          <span>== SEARCH :: ZASHA.ONLINE ==</span>
          <nav>
            <a href="index.html">KAMUS</a>
            <a href="todo.html">TODO</a>
            <a href="notes.html">NOTES</a>
            <a href="excel.html">EXCEL</a>
          </nav>
        </div>

        <div id="layout">
          <div id="sidebar">
            <div id="sidebar-top">[ history ]</div>
            <div id="history-list"></div>
          </div>

          <div id="main-area">
            <div id="status"></div>
            <div id="table-wrap"></div>
            <div id="empty-state">
              <span>Ketik kata kunci dan tekan Enter</span>
              <span style="color:#001a00;">clear history &nbsp;&middot;&nbsp; goto kamus / todo / notes / excel</span>
            </div>
          </div>
        </div>

        <div id="cmd-bar">
          <span id="cmd-prompt">root@zasha:~/search$</span>
          <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" autofocus placeholder="cari kata kunci...">
          <span id="cmd-hint"></span>
        </div>
      </div>
    </div>

    <div class="hk-foot">
      <span><span class="dot-live"></span><b>ONLINE</b></span>
      <span>CPU <b id="hkCpu">--</b> &middot; MEM <b id="hkMem">--</b> &middot; PING <b id="hkPing">--</b></span>
    </div>

  </div>
  <div class="hk-scan"></div>
</div>

<script>
const API_URL   = 'https://script.google.com/macros/s/AKfycbx_qpzdVOuVyb4fvzLxsCLH-IzM1fJFPaNyqKLrhWPJFNCkp-5XXHoRRXcYNmtQXjK8XQ/exec';
const API_TOKEN = 'muzadidil';
const HIST_KEY  = 'zasha_search_history';
const PAGES     = { kamus:'index.html', todo:'todo.html', notes:'notes.html', excel:'excel.html' };

const cmdInput   = document.getElementById('cmd-input');
const statusEl   = document.getElementById('status');
const tableWrap  = document.getElementById('table-wrap');
const emptyState = document.getElementById('empty-state');
const histList   = document.getElementById('history-list');

function getHistory() {
  try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch { return []; }
}
function addHistory(q) {
  let h = getHistory().filter(x => x !== q);
  h.unshift(q);
  if (h.length > 20) h = h.slice(0, 20);
  localStorage.setItem(HIST_KEY, JSON.stringify(h));
}

function renderHistory() {
  const h = getHistory();
  histList.innerHTML = '';
  if (!h.length) {
    histList.innerHTML = '<div style="color:#001a00;font-size:12px;padding:10px;text-shadow:none;">Belum ada riwayat.</div>';
    return;
  }
  h.forEach(q => {
    const item = document.createElement('div');
    item.className = 'hist-item';
    item.textContent = q;
    item.addEventListener('click', () => runSearch(q));
    histList.appendChild(item);
  });
}

cmdInput.addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  const raw = cmdInput.value.trim();
  if (!raw) return;
  cmdInput.value = '';
  const lower = raw.toLowerCase();

  if (lower === 'exit' || lower === 'goto kamus') { window.location.href = 'index.html'; return; }
  if (lower.startsWith('goto ')) {
    const dest = lower.substring(5).trim();
    if (PAGES[dest]) { window.location.href = PAGES[dest]; return; }
  }
  if (lower === 'clear history') {
    localStorage.removeItem(HIST_KEY);
    renderHistory();
    setStatus('History dihapus.', 'count');
    return;
  }

  await runSearch(raw);
});

async function runSearch(q) {
  cmdInput.disabled = true;
  setStatus('> searching "' + q + '"...', 'loading');
  tableWrap.innerHTML = '';
  tableWrap.style.display = 'none';
  emptyState.style.display = 'none';
  try {
    const res  = await fetch(API_URL + '?token=' + encodeURIComponent(API_TOKEN) + '&q=' + encodeURIComponent(q));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json.error) { setStatus('[' + json.error.toUpperCase() + '] ' + (json.message || ''), 'error'); return; }
    if (json.count === 0) { setStatus('Tidak ada hasil untuk "' + q + '".', 'empty'); emptyState.style.display = 'flex'; return; }
    setStatus(json.count + ' baris ditemukan untuk "' + q + '".', 'count');
    renderTable(json.data);
    addHistory(q);
    renderHistory();
  } catch (err) {
    setStatus('[ERROR] Gagal menghubungi API: ' + err.message, 'error');
    emptyState.style.display = 'flex';
  } finally {
    cmdInput.disabled = false;
    cmdInput.focus();
  }
}

function renderTable(rows) {
  if (!rows.length) return;
  const headers = Object.keys(rows[0]);
  const table = document.createElement('table');
  table.id = 'search-table';
  const thead = table.createTHead(), hrow = thead.insertRow();
  headers.forEach(h => { const th = document.createElement('th'); th.textContent = h; hrow.appendChild(th); });
  const tbody = table.createTBody();
  rows.forEach(row => {
    const tr = tbody.insertRow();
    headers.forEach(h => { const td = tr.insertCell(); td.textContent = (row[h] != null) ? String(row[h]) : ''; });
  });
  tableWrap.appendChild(table);
  tableWrap.style.display = 'block';
}

function setStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = 's-' + (type || 'count');
}

renderHistory();
emptyState.style.display = 'flex';
</script>

<script>
(function(){
  var cv=document.getElementById('hkRain'); if(!cv)return;
  var ctx=cv.getContext('2d'),st=cv.parentElement,fs=14;
  var chars='アイウエオカキクケコ0123456789ABCDEF!@#$%'.split('');
  function resize(){cv.width=st.clientWidth;cv.height=st.clientHeight;}
  resize(); window.addEventListener('resize',resize);
  var drops=Array.from({length:Math.floor(cv.width/fs)},function(){return Math.floor(Math.random()*-50);});
  setInterval(function(){
    ctx.fillStyle='rgba(2,4,2,0.08)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#0f0';ctx.font=fs+'px monospace';
    for(var i=0;i<drops.length;i++){
      ctx.fillText(chars[Math.floor(Math.random()*chars.length)],i*fs,drops[i]*fs);
      if(drops[i]*fs>cv.height&&Math.random()>0.975)drops[i]=0;
      drops[i]++;
    }
  },55);
  function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  var eC=document.getElementById('hkCpu'),eM=document.getElementById('hkMem'),eP=document.getElementById('hkPing');
  function upd(){eC.textContent=(Math.random()*35+4).toFixed(1)+'%';eM.textContent=(Math.random()*25+38).toFixed(1)+'%';eP.textContent=rnd(6,48)+'ms';}
  upd();setInterval(upd,900);
})();
</script>
</body>
</html>
