<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTES :: Zasha Terminal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding: 0; overflow: hidden; }

        #lock-screen { max-width: 700px; margin: 40px auto; padding: 20px; }

        #app {
            display: none;
            height: 100vh;
            flex-direction: column;
            box-sizing: border-box;
        }

        #app-header {
            padding: 10px 15px;
            border-bottom: 1px solid #003300;
            font-size: 12px;
            color: #005500;
            text-shadow: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        #app-header span { color: #00aa00; }
        #app-header a { color: #004400; text-decoration: none; margin-left: 10px; }
        #app-header a:hover { color: #00ff00; }

        #layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        #sidebar {
            width: 220px;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #003300;
            flex-shrink: 0;
        }
        #sidebar-top {
            padding: 10px 12px;
            border-bottom: 1px solid #003300;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        #sidebar-top span { color: #00aa00; font-size: 12px; text-shadow: none; }
        #btn-new {
            background: transparent;
            border: 1px solid #005500;
            color: #00aa00;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 3px 8px;
            cursor: pointer;
        }
        #btn-new:hover { border-color: #00ff00; color: #00ff00; }

        #notes-list {
            flex: 1;
            overflow-y: auto;
        }
        #notes-list::-webkit-scrollbar { width: 4px; }
        #notes-list::-webkit-scrollbar-track { background: #000; }
        #notes-list::-webkit-scrollbar-thumb { background: #003300; }

        .note-item {
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid #001a00;
        }
        .note-item:hover, .note-item.active { background: rgba(0,255,0,0.06); }
        .note-item .ni-title {
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #00cc00;
        }
        .note-item.active .ni-title { color: #00ff00; }
        .note-item .ni-preview {
            font-size: 11px;
            color: #004400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
            text-shadow: none;
        }
        .note-item .ni-date {
            font-size: 10px;
            color: #003300;
            margin-top: 3px;
            text-shadow: none;
        }
        #empty-list { color: #003300; font-size: 12px; padding: 15px 12px; text-shadow: none; }

        /* --- EDITOR --- */
        #editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #editor-toolbar {
            padding: 8px 15px;
            border-bottom: 1px solid #003300;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        #note-title-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            caret-color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
        #note-title-input::placeholder { color: #003300; text-shadow: none; }
        .btn-tool {
            background: transparent;
            border: 1px solid #004400;
            color: #007700;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            padding: 3px 8px;
            cursor: pointer;
            white-space: nowrap;
            text-shadow: none;
        }
        .btn-tool:hover { border-color: #00ff00; color: #00ff00; }
        .btn-del-note { border-color: #440000; color: #880000; }
        .btn-del-note:hover { border-color: #ff3333; color: #ff3333; }

        #note-content-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            padding: 15px;
            outline: none;
            resize: none;
            line-height: 1.7;
            text-shadow: 0 0 3px rgba(0,255,0,0.4);
            overflow-y: auto;
        }
        #note-content-input::placeholder { color: #003300; text-shadow: none; }
        #note-content-input::-webkit-scrollbar { width: 4px; }
        #note-content-input::-webkit-scrollbar-track { background: #000; }
        #note-content-input::-webkit-scrollbar-thumb { background: #003300; }

        #editor-status {
            padding: 4px 15px;
            font-size: 11px;
            color: #004400;
            text-shadow: none;
            border-top: 1px solid #001a00;
            flex-shrink: 0;
        }

        #empty-editor {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #003300;
            text-shadow: none;
            font-size: 13px;
        }

        /* Password input override */
        input[type="password"] {
            background-color: transparent;
            border: none;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            flex-grow: 1;
            outline: none;
            caret-color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }

        @media (max-width: 600px) {
            body { overflow: auto; }
            #app { height: auto; }
            #layout { flex-direction: column; }
            #sidebar { width: 100%; border-right: none; border-bottom: 1px solid #003300; max-height: 200px; }
            #editor-panel { min-height: 60vh; }
            #note-content-input { min-height: 50vh; }
        }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="error-msg">SYSTEM SECURED. ENTER PASSWORD TO ACCESS NOTES MODULE.</div>
    <br>
    <div class="input-line">
        <span class="prompt">password:</span>
        <input type="password" id="pass-input" autocomplete="new-password" autofocus spellcheck="false">
    </div>
    <div id="lock-error" class="error-msg" style="margin-top:10px; display:none;">ACCESS DENIED.</div>
</div>

<div id="app">
    <div id="app-header">
        <span>== NOTES MODULE == &nbsp; CTRL+S Save &nbsp;|&nbsp; ESC Batal</span>
        <div>
            <a href="index.html">KAMUS</a>
            <a href="todo.html">TODO</a>
            <a href="excel.html">EXCEL</a>
        </div>
    </div>

    <div id="layout">
        <!-- Sidebar -->
        <div id="sidebar">
            <div id="sidebar-top">
                <span>[ <span id="note-count">0</span> notes ]</span>
                <button id="btn-new">+ NEW</button>
            </div>
            <div id="notes-list">
                <div id="empty-list">Belum ada catatan.</div>
            </div>
        </div>

        <!-- Editor -->
        <div id="editor-panel">
            <div id="empty-editor">← Pilih note atau tekan + NEW</div>

            <div id="editor-form" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
                <div id="editor-toolbar">
                    <input type="text" id="note-title-input" placeholder="Judul catatan..." autocomplete="off" spellcheck="false">
                    <button class="btn-tool" id="btn-save">[CTRL+S] SAVE</button>
                    <button class="btn-tool btn-del-note" id="btn-delete">[DEL]</button>
                </div>
                <textarea id="note-content-input" placeholder="Tulis catatan di sini..." spellcheck="false"></textarea>
                <div id="editor-status">--</div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="notes.js"></script>
</body>
</html>
