<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kamus.zasha.online — Search Terminal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <div class="hk-stage">

    <canvas class="hk-rain" id="hkRain"></canvas>

    <div class="hk-win">
      <div class="hk-bar">
        <span class="hk-dot" style="background:#ff5f56;box-shadow:0 0 4px #ff5f5680"></span>
        <span class="hk-dot" style="background:#ffbd2e;box-shadow:0 0 4px #ffbd2e80"></span>
        <span class="hk-dot" style="background:#27c93f;box-shadow:0 0 4px #27c93f80"></span>
        <span class="bar-label">root@kamus.zasha.online: ~/secure</span>
        <span class="bar-right">&#x1F512; ENCRYPTED</span>
      </div>

      <div class="hk-body" id="hkBody"></div>

      <div class="hk-foot">
        <span id="hkStat"><b>STATUS:</b> connecting...</span>
        <span>CPU <b id="hkCpu">--</b> &middot; MEM <b id="hkMem">--</b> &middot; PING <b id="hkPing">--</b> &middot; IP <b id="hkIp">--</b></span>
      </div>
    </div>

    <div class="hk-scan"></div>
  </div>
</div>

<script>
const API_URL   = 'https://script.google.com/macros/s/AKfycbxPQTPesWMKfYiRsVo6ZpHRdkx_vmXxlGZ9FiJchZ5CDFB2kYK_86Gyuf_yXnepaLy6lA/exec';
const API_TOKEN = 'muzadidil';
const MAX_Q_LEN = 80;

const BOOT_LINES = [
  { t: '[ boot ] initializing secure shell ...',                c: 'hk-dim',  d: 10 },
  { t: '[  ok  ] kernel modules loaded',                        c: '',        d: 8  },
  { t: '[  ok  ] mounting /dev/sheets (read-only)',              c: '',        d: 8  },
  { t: '[ warn ] public endpoint exposed · token guard active', c: 'hk-warn', d: 12 },
  { t: '[  ok  ] connection established · TLS 1.3',             c: '',        d: 8  },
  { t: '[  ok  ] API endpoint authenticated',                   c: '',        d: 8  },
  { t: '[  ok  ] all modules loaded · system ready',            c: '',        d: 8  },
];

const ASCII_BANNER = [
  ' _  __ ___  __  __ _   _ ____',
  '| |/ // _ \\|  \\/  | | | / ___|',
  "| ' /| | | | |\\/| | | | \\___ \\",
  '| . \\| |_| | |  | | |_| |___) |',
  '|_|\\_\\\\___/|_|  |_|\\___/|____/',
].join('\n');

const HELP_TEXT = [
  '',
  '  ┌──────────────────────────────────────────┐',
  '  │         AVAILABLE COMMANDS               │',
  '  ├──────────────────────────────────────────┤',
  '  │  search <keyword>  — search the database  │',
  '  │  help              — show this help       │',
  '  │  clear             — clear the screen     │',
  '  └──────────────────────────────────────────┘',
  '',
  '  Examples:',
  '    search resti wahyu utami',
  '    search jakarta',
  '',
].join('\n');

// ── DOM ───────────────────────────────────────────────────────────────────────
const termBody = document.getElementById('hkBody');
let   inputEl  = null;

// ── Matrix rain ───────────────────────────────────────────────────────────────
(function initMatrix() {
  const canvas = document.getElementById('hkRain');
  const ctx    = canvas.getContext('2d');
  const stage  = canvas.parentElement;
  const CHARS  = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ0123456789ABCDEF!@#$%'.split('');
  const FS     = 14;
  let cols, drops;

  function resize() {
    canvas.width  = stage.clientWidth;
    canvas.height = stage.clientHeight;
    cols  = Math.floor(canvas.width / FS);
    drops = Array.from({ length: cols }, () => Math.floor(Math.random() * -50));
  }

  function draw() {
    ctx.fillStyle = 'rgba(2,4,2,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0f0';
    ctx.font      = FS + 'px monospace';
    for (let i = 0; i < cols; i++) {
      const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
      ctx.fillText(ch, i * FS, drops[i] * FS);
      if (drops[i] * FS > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }

  resize();
  window.addEventListener('resize', resize);
  setInterval(draw, 55);
})();

// ── Status bar ────────────────────────────────────────────────────────────────
(function initMetrics() {
  const elCpu  = document.getElementById('hkCpu');
  const elMem  = document.getElementById('hkMem');
  const elPing = document.getElementById('hkPing');
  const elIp   = document.getElementById('hkIp');
  const elStat = document.getElementById('hkStat');

  function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }

  elIp.textContent = '10.' + rnd(0,50) + '.' + rnd(0,255) + '.' + rnd(1,254);

  function update() {
    elCpu.textContent  = (Math.random() * 35 + 4).toFixed(1) + '%';
    elMem.textContent  = (Math.random() * 25 + 38).toFixed(1) + '%';
    elPing.textContent = rnd(6, 48) + 'ms';
  }

  update();
  setInterval(update, 900);

  setTimeout(() => {
    elStat.innerHTML = '<b>STATUS:</b> <span style="color:#0f0;text-shadow:0 0 4px #0f0">ONLINE · query ok</span>';
  }, 4000);
})();

// ── Boot sequence ─────────────────────────────────────────────────────────────
async function boot() {
  for (const line of BOOT_LINES) {
    await typeLog(line.t, line.c, line.d);
    await pause(65);
  }
  await pause(180);
  showBanner();
  await pause(200);
  showPrompt();
}

async function typeLog(text, cls, speed) {
  const div = document.createElement('div');
  div.className = 'output-line ' + cls;
  termBody.appendChild(div);
  for (const ch of text) {
    div.textContent += ch;
    scrollBottom();
    await pause(speed);
  }
}

function showBanner() {
  const pre = document.createElement('span');
  pre.className   = 'hk-asc';
  pre.textContent = ASCII_BANNER;
  termBody.appendChild(pre);
  appendLine('authenticated as <b>operator</b> · access level: READ', '');
  appendLine('type "help" for available commands.', 'hk-dim');
  appendLine('', 'hk-dim');
  scrollBottom();
}

// ── Prompt ────────────────────────────────────────────────────────────────────
function showPrompt() {
  const line = document.createElement('div');
  line.className = 'prompt-line';

  const sign = document.createElement('span');
  sign.className   = 'hk-prompt';
  sign.textContent = 'root@kamus:~$';

  inputEl = document.createElement('input');
  inputEl.type         = 'text';
  inputEl.id           = 'cmd-input';
  inputEl.autocomplete = 'off';
  inputEl.spellcheck   = false;
  inputEl.addEventListener('keydown', onEnter);

  const cursor = document.createElement('span');
  cursor.className = 'hk-cur';
  inputEl.addEventListener('focus', () => { cursor.style.visibility = 'hidden'; });
  inputEl.addEventListener('blur',  () => { cursor.style.visibility = 'visible'; });

  line.appendChild(sign);
  line.appendChild(inputEl);
  line.appendChild(cursor);
  termBody.appendChild(line);
  inputEl.focus();
  scrollBottom();

  termBody.addEventListener('click', () => inputEl && inputEl.focus());
}

// ── Key handler ───────────────────────────────────────────────────────────────
async function onEnter(e) {
  if (e.key !== 'Enter') return;
  const raw = inputEl.value.trim();
  inputEl.value = '';
  if (!raw) return;

  appendLine('root@kamus:~$ ' + raw, 'hk-echo');
  inputEl.closest('.prompt-line').remove();
  inputEl = null;

  await dispatch(raw);
  showPrompt();
}

// ── Command dispatcher ────────────────────────────────────────────────────────
async function dispatch(raw) {
  const lower = raw.toLowerCase().trim();

  if (lower === 'help') {
    appendLine(HELP_TEXT, 'hk-dim');
    return;
  }

  if (lower === 'clear') {
    termBody.innerHTML = '';
    showBanner();
    return;
  }

  if (lower.startsWith('search ')) {
    const q = raw.substring(7).trim().substring(0, MAX_Q_LEN);
    if (q) { await runSearch(q); }
    else   { appendLine('[error] Usage: search <keyword>', 'hk-err'); }
    return;
  }

  if (lower === 'search') {
    appendLine('[error] Usage: search <keyword>', 'hk-err');
    appendLine('        Example: search resti wahyu utami', 'hk-dim');
    return;
  }

  appendLine('[error] command not found: ' + esc(raw), 'hk-err');
  appendLine('        type "help" for available commands.', 'hk-dim');
}

// ── Search ────────────────────────────────────────────────────────────────────
async function runSearch(q) {
  appendLine('', 'hk-dim');
  appendLine('> query --keyword "' + esc(q) + '"', 'hk-sys');
  await pause(100);
  appendLine('> scanning rows ...', 'hk-sys');

  const url = API_URL
    + '?token=' + encodeURIComponent(API_TOKEN)
    + '&q='     + encodeURIComponent(q);

  try {
    const res  = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);

    const json = await res.json();

    if (json.error) {
      appendLine('[error] API: ' + esc(json.message || json.error), 'hk-err');
      return;
    }

    if (json.count === 0) {
      appendLine('> scanning ' + (json.total || '?') + ' rows ... matched 0', 'hk-dim');
      appendLine('[warn] no records found for: "' + esc(q) + '"', 'hk-warn');
      return;
    }

    appendLine('> scanning ' + (json.total || '?') + ' rows ... matched ' + json.count, 'hk-dim');
    appendLine('[ok] ' + json.count + ' record(s) found.', '');
    renderTable(json.data, q);

  } catch (err) {
    appendLine('[error] failed to reach API: ' + esc(err.message), 'hk-err');
    appendLine('[error] check API_URL or redeploy Apps Script.', 'hk-err');
  }
}

// ── Table (textContent only — XSS safe) ──────────────────────────────────────
function renderTable(rows, query) {
  if (!rows.length) return;

  const headers = Object.keys(rows[0]);
  const q       = query.toLowerCase();

  const wrap  = document.createElement('div');
  wrap.className = 'result-wrap';

  const table = document.createElement('table');
  table.className = 'hk-tbl';

  const thead = table.createTHead();
  const hrow  = thead.insertRow();
  headers.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    hrow.appendChild(th);
  });

  const tbody = table.createTBody();
  rows.forEach(row => {
    const tr      = tbody.insertRow();
    const isMatch = headers.some(h => String(row[h] ?? '').toLowerCase().includes(q));
    if (isMatch) tr.classList.add('hk-hit');
    headers.forEach(h => {
      const td = tr.insertCell();
      td.textContent = row[h] !== undefined ? String(row[h]) : '';
    });
  });

  const tfoot = table.createTFoot();
  const frow  = tfoot.insertRow();
  const ftd   = frow.insertCell();
  ftd.colSpan     = headers.length;
  ftd.className   = 'result-count';
  ftd.textContent = rows.length + ' rows returned';

  wrap.appendChild(table);
  termBody.appendChild(wrap);
  scrollBottom();
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function appendLine(text, cls) {
  const div = document.createElement('div');
  div.className = 'output-line ' + (cls || '');
  div.innerHTML = text;
  termBody.appendChild(div);
  scrollBottom();
}

function scrollBottom() { termBody.scrollTop = termBody.scrollHeight; }
function pause(ms)       { return new Promise(r => setTimeout(r, ms)); }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

boot();
</script>
</body>
</html>
