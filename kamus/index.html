<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kamus.zasha.online — Search Terminal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <div class="hk-stage">

    <!-- Matrix rain background -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Terminal window -->
    <div class="hk-win">

      <!-- Title bar -->
      <div class="hk-bar">
        <span class="hk-dot dot-r"></span>
        <span class="hk-dot dot-y"></span>
        <span class="hk-dot dot-g"></span>
        <span class="bar-label">root@kamus.zasha.online: ~/secure</span>
        <span class="bar-right">&#x1F512; ENCRYPTED</span>
      </div>

      <!-- Terminal output -->
      <div class="hk-body" id="terminal-body"></div>

      <!-- Status bar (inside terminal) -->
      <div class="hk-foot">
        <span><span class="dot-live"></span><span id="sb-status">connecting...</span></span>
        <span>
          CPU <span class="val" id="sb-cpu">--</span>%
          &nbsp;&middot;&nbsp;
          MEM <span class="val" id="sb-mem">--</span>%
          &nbsp;&middot;&nbsp;
          PING <span class="val" id="sb-ping">--</span>ms
          &nbsp;&middot;&nbsp;
          IP <span class="val" id="sb-ip">--</span>
        </span>
      </div>

    </div>

    <!-- CRT scanline overlay (on top of everything) -->
    <div class="hk-scan"></div>

  </div>
</div>

<script>
// =============================================================================
// Configuration
// TODO: Token visible in browser source — fine for casual protection only.
//       Upgrade to server-side proxy / OAuth for sensitive data.
// =============================================================================
const API_URL   = 'https://script.google.com/macros/s/AKfycbxPQTPesWMKfYiRsVo6ZpHRdkx_vmXxlGZ9FiJchZ5CDFB2kYK_86Gyuf_yXnepaLy6lA/exec';
const API_TOKEN = 'muzadidil';
const MAX_Q_LEN = 80;

// =============================================================================
// Boot sequence
// =============================================================================
const BOOT_LINES = [
  { t: '[ boot ] initializing secure shell ...',                c: 'log-dim',  d: 10 },
  { t: '[  ok  ] kernel modules loaded',                        c: 'log-ok',   d: 8  },
  { t: '[  ok  ] mounting /dev/sheets (read-only)',              c: 'log-ok',   d: 8  },
  { t: '[ warn ] public endpoint exposed · token guard active', c: 'log-warn', d: 12 },
  { t: '[  ok  ] connection established · TLS 1.3',            c: 'log-ok',   d: 8  },
  { t: '[  ok  ] API endpoint authenticated',                   c: 'log-ok',   d: 8  },
  { t: '[  ok  ] all modules loaded · system ready',           c: 'log-ok',   d: 8  },
];

const ASCII_BANNER = [
  ' _  __ ___  __  __ _   _ ____',
  '| |/ // _ \\|  \\/  | | | / ___|',
  "| ' /| | | | |\\/| | | | \\___ \\",
  '| . \\| |_| | |  | | |_| |___) |',
  '|_|\\_\\\\___/|_|  |_|\\___/|____/',
].join('\n');

const HELP_TEXT = [
  '',
  '  ┌──────────────────────────────────────────┐',
  '  │         AVAILABLE COMMANDS               │',
  '  ├──────────────────────────────────────────┤',
  '  │  search <keyword>  — search the database  │',
  '  │  help              — show this help       │',
  '  │  clear             — clear the screen     │',
  '  └──────────────────────────────────────────┘',
  '',
  '  Examples:',
  '    search resti wahyu utami',
  '    search jakarta',
  '',
].join('\n');

// =============================================================================
// DOM
// =============================================================================
const termBody = document.getElementById('terminal-body');
let   inputEl  = null;

// =============================================================================
// Matrix rain — canvas is inside .hk-stage (not full-page)
// =============================================================================
(function initMatrix() {
  const canvas = document.getElementById('matrix-canvas');
  const ctx    = canvas.getContext('2d');
  const stage  = canvas.parentElement;
  const CHARS  = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ0123456789ABCDEF!@#$%'.split('');
  const FS     = 14;
  let cols, drops;

  function resize() {
    canvas.width  = stage.clientWidth;
    canvas.height = stage.clientHeight;
    cols  = Math.floor(canvas.width / FS);
    drops = Array.from({ length: cols }, () => Math.floor(Math.random() * -50));
  }

  function draw() {
    ctx.fillStyle = 'rgba(2,4,2,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#0f0';
    ctx.font      = FS + 'px monospace';
    for (let i = 0; i < cols; i++) {
      const ch = CHARS[Math.floor(Math.random() * CHARS.length)];
      ctx.fillText(ch, i * FS, drops[i] * FS);
      if (drops[i] * FS > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }

  resize();
  window.addEventListener('resize', resize);
  setInterval(draw, 55);
})();

// =============================================================================
// Status bar metrics
// =============================================================================
(function initMetrics() {
  const sbCpu    = document.getElementById('sb-cpu');
  const sbMem    = document.getElementById('sb-mem');
  const sbPing   = document.getElementById('sb-ping');
  const sbIp     = document.getElementById('sb-ip');
  const sbStatus = document.getElementById('sb-status');

  sbIp.textContent = '10.' + rnd(0,50) + '.' + rnd(0,255) + '.' + rnd(1,254);

  function update() {
    sbCpu.textContent  = (Math.random() * 35 + 4).toFixed(1);
    sbMem.textContent  = (Math.random() * 25 + 38).toFixed(1);
    sbPing.textContent = rnd(6, 48);
  }

  update();
  setInterval(update, 900);

  // Set status to ONLINE after boot
  setTimeout(() => {
    sbStatus.textContent = 'ONLINE · query ok';
    sbStatus.style.color = '#00ff00';
    sbStatus.style.textShadow = '0 0 4px #00ff00';
  }, 4000);

  function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
})();

// =============================================================================
// Boot sequence
// =============================================================================
async function boot() {
  for (const line of BOOT_LINES) {
    await typeLog(line.t, line.c, line.d);
    await pause(65);
  }
  await pause(180);
  showBanner();
  await pause(200);
  showPrompt();
}

async function typeLog(text, cls, speed) {
  const div = document.createElement('div');
  div.className = 'log-line ' + cls;
  termBody.appendChild(div);
  for (const ch of text) {
    div.textContent += ch;
    scrollBottom();
    await pause(speed);
  }
}

function showBanner() {
  const pre = document.createElement('pre');
  pre.className = 'ascii-banner';
  pre.textContent = ASCII_BANNER;
  termBody.appendChild(pre);
  appendLine('authenticated as operator · access level: READ', 'log-ok');
  appendLine('type "help" for available commands.', 'log-dim');
  appendLine('', 'log-dim');
  scrollBottom();
}

// =============================================================================
// Prompt
// =============================================================================
function showPrompt() {
  const line   = document.createElement('div');
  line.className = 'prompt-line';

  const sign   = document.createElement('span');
  sign.className   = 'prompt-sign';
  sign.textContent = 'root@kamus:~$';

  inputEl = document.createElement('input');
  inputEl.type         = 'text';
  inputEl.id           = 'cmd-input';
  inputEl.autocomplete = 'off';
  inputEl.spellcheck   = false;
  inputEl.addEventListener('keydown', onEnter);

  const cursor = document.createElement('span');
  cursor.className = 'prompt-cursor';
  inputEl.addEventListener('focus', () => { cursor.style.visibility = 'hidden'; });
  inputEl.addEventListener('blur',  () => { cursor.style.visibility = 'visible'; });

  line.appendChild(sign);
  line.appendChild(inputEl);
  line.appendChild(cursor);
  termBody.appendChild(line);
  inputEl.focus();
  scrollBottom();

  termBody.addEventListener('click', () => inputEl && inputEl.focus());
}

// =============================================================================
// Key handler
// =============================================================================
async function onEnter(e) {
  if (e.key !== 'Enter') return;
  const raw = inputEl.value.trim();
  inputEl.value = '';
  if (!raw) return;

  appendLine('root@kamus:~$ ' + raw, 'log-echo');
  inputEl.closest('.prompt-line').remove();
  inputEl = null;

  await dispatch(raw);
  showPrompt();
}

// =============================================================================
// Command dispatcher
// =============================================================================
async function dispatch(raw) {
  const lower = raw.toLowerCase().trim();

  if (lower === 'help') {
    appendLine(HELP_TEXT, 'log-dim');
    return;
  }

  if (lower === 'clear') {
    termBody.innerHTML = '';
    showBanner();
    return;
  }

  if (lower.startsWith('search ')) {
    const q = raw.substring(7).trim().substring(0, MAX_Q_LEN);
    if (q) { await runSearch(q); }
    else   { appendLine('[error] Usage: search <keyword>', 'log-error'); }
    return;
  }

  if (lower === 'search') {
    appendLine('[error] Usage: search <keyword>', 'log-error');
    appendLine('        Example: search resti wahyu utami', 'log-dim');
    return;
  }

  appendLine('[error] command not found: ' + esc(raw), 'log-error');
  appendLine('        type "help" for available commands.', 'log-dim');
}

// =============================================================================
// Search
// =============================================================================
async function runSearch(q) {
  appendLine('', 'log-dim');
  appendLine('> query --keyword "' + esc(q) + '"', 'log-sys');
  await pause(100);
  appendLine('> scanning rows ...', 'log-sys');

  const url = API_URL
    + '?token=' + encodeURIComponent(API_TOKEN)
    + '&q='     + encodeURIComponent(q);

  try {
    const res  = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);

    const json = await res.json();

    if (json.error) {
      appendLine('[error] API: ' + esc(json.message || json.error), 'log-error');
      return;
    }

    if (json.count === 0) {
      appendLine('> scanning ' + (json.total || '?') + ' rows ... matched 0', 'log-dim');
      appendLine('[warn] no records found for: "' + esc(q) + '"', 'log-warn');
      return;
    }

    appendLine('> scanning ' + (json.total || '?') + ' rows ... matched ' + json.count, 'log-dim');
    appendLine('[ok] ' + json.count + ' record(s) found.', 'log-ok');
    renderTable(json.data, q);

  } catch (err) {
    appendLine('[error] failed to reach API: ' + esc(err.message), 'log-error');
    appendLine('[error] check API_URL or redeploy Apps Script.', 'log-error');
  }
}

// =============================================================================
// Table — textContent only (XSS safe)
// =============================================================================
function renderTable(rows, query) {
  if (!rows.length) return;

  const headers = Object.keys(rows[0]);
  const q       = query.toLowerCase();

  const wrap  = document.createElement('div');
  wrap.className = 'result-wrap';

  const table = document.createElement('table');
  table.className = 'result-table';

  // thead
  const thead = table.createTHead();
  const hrow  = thead.insertRow();
  headers.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    hrow.appendChild(th);
  });

  // tbody
  const tbody = table.createTBody();
  rows.forEach(row => {
    const tr      = tbody.insertRow();
    const isMatch = headers.some(h => String(row[h] ?? '').toLowerCase().includes(q));
    if (isMatch) tr.classList.add('match-row');
    headers.forEach(h => {
      const td = tr.insertCell();
      td.textContent = row[h] !== undefined ? String(row[h]) : '';
    });
  });

  // tfoot
  const tfoot = table.createTFoot();
  const frow  = tfoot.insertRow();
  const ftd   = frow.insertCell();
  ftd.colSpan   = headers.length;
  ftd.className = 'result-count';
  ftd.textContent = rows.length + ' rows returned';

  wrap.appendChild(table);
  termBody.appendChild(wrap);
  scrollBottom();
}

// =============================================================================
// Utilities
// =============================================================================
function appendLine(text, cls) {
  const div = document.createElement('div');
  div.className   = 'log-line ' + (cls || 'log-ok');
  div.textContent = text;
  termBody.appendChild(div);
  scrollBottom();
}

function scrollBottom() { termBody.scrollTop = termBody.scrollHeight; }
function pause(ms)       { return new Promise(r => setTimeout(r, ms)); }
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// =============================================================================
// Start
// =============================================================================
boot();
</script>
</body>
</html>
